var CONFIG = {
  displayModeBar: true,
  responsive: true,
  toImageButtonOptions: {
    filename: 'fig4_combined_zscore',
    format: 'png', width: 1300, height: 520
  }
};

/* ── 렌더링 후 이벤트 바인딩 ─────────────────────── */
Plotly.newPlot('chart', FIG_DATA, FIG_LAYOUT, CONFIG).then(function(gd) {

  var BASE   = '2';    // 기본 stroke-width
  var THICK  = '2';   // 강조 stroke-width
  var THIN   = '0.7';        // 비강조 stroke-width
  var FADE   = '0.2';    // 비강조 opacity

  /* .scatterlayer 아래 trace <g> 요소 배열 반환 */
  function getGroups() {
    return Array.from(gd.querySelectorAll('.scatterlayer .trace'));
  }

  /* stroke-width 강제 적용 (SVG attribute + inline style 동시 설정) */
  function applyStroke(g, w) {
    var path = g.querySelector('path.js-line');
    if (!path) return;
    path.setAttribute('stroke-width', w);
    path.style.setProperty('stroke-width', w + 'px', 'important');
  }

  /* 전체 초기화 */
  function resetAll() {
    getGroups().forEach(function(g) {
      g.style.opacity = '1';
      applyStroke(g, BASE);
    });
  }

  /* 호버: 해당 trace 강조 */
  gd.on('plotly_hover', function(ev) {
    var idx = ev.points[0].curveNumber;
    getGroups().forEach(function(g, i) {
      if (i === idx) {
        g.style.opacity = '1';
        applyStroke(g, THICK);
      } else {
        g.style.opacity = FADE;
        applyStroke(g, THIN);
      }
    });
  });

  /* 마우스 벗어남: 전체 원상복구 */
  gd.on('plotly_unhover', function() {
    resetAll();
  });

  /* 범례 클릭(숨김/표시) 후에도 style 재동기화 */
  gd.on('plotly_restyle', function() {
    setTimeout(resetAll, 60);
  });
});
</script>
